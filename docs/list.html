      <h1 style="font-size:clamp(1.4rem,5vw,1.9rem)">同い年ロボット 記録一覧</h1>

<script src="data.js"></script>
<script>
  (function () {
    const ledger = document.getElementById("ledger");
    const sorted = ROBOTS.slice().sort((a, b) => a.year - b.year || a.id - b.id);
    sorted.forEach((r) => {
      const a = document.createElement("a");
      a.className = "ledger-row";
      a.href = "index.html?year=" + r.year + "&id=" + r.id;
      a.innerHTML =
        '<span class="ledger-year">' + r.year + "</span>" +
        '<span class="ledger-name">' + r.name + (r.nameEn ? '<span class="ledger-en">' + r.nameEn + "</span>" : "") + "</span>" +
        '<span class="ledger-cat">' + (CATEGORY_LABEL[r.category] || r.category) + "</span>" +
        '<span class="ledger-kind' + (r.fiction ? " is-fiction" : "") + '">' + (r.fiction ? "フィクション" : "実在") + "</span>";
      ledger.appendChild(a);
    });
  })();
</script>
