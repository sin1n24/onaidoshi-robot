<div class="sheet">
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14h24v9a12 12 0 0 1-24 0z"/><path d="M20 16h-6a6 6 0 0 0 6 10"/><path d="M44 16h6a6 6 0 0 1-6 10"/><line x1="32" y1="35" x2="32" y2="46"/><rect x="22" y="46" width="20" height="6" rx="1"/>
      </svg>
      <span>記録一覧 — <a href="https://sin1.studio/">sin1's studio</a></span>
      <a class="list-link" href="index.html">検索へ戻る</a>
    </div>

    <section class="hero" style="text-align:left">
      <h1 style="font-size:clamp(1.4rem,5vw,1.9rem)">同い年ロボット 記録一覧</h1>
      <p class="lead" style="margin:0 0 12px">収録している全記録です。年をクリックすると、その記録のカードを直接表示します。</p>
      <p class="lead" style="margin:0 0 28px">「フィクション」タグの記録は、トップページの「同い年のロボットを探す」検索には含まれません。この一覧からのみ確認できます。</p>
    </section>

    <div class="filter-bar" id="filterBar">
      <button type="button" class="filter-pill is-active" data-filter="all">すべて</button>
      <button type="button" class="filter-pill" data-filter="real">実在</button>
      <button type="button" class="filter-pill" data-filter="competition">大会</button>
      <button type="button" class="filter-pill" data-filter="fiction">フィクション</button>
    </div>

    <div class="ledger" id="ledger"></div>

    <footer>
      <a class="footer-logo" href="https://sin1.studio/">
        <img src="img/sss_logo_3x1_white.png" alt="sin1's studio">
      </a>
      <p>実在のロボット・ロボット競技のほか、有名な架空のロボットも収録しています。データは編集者が調べた範囲でまとめたものです。</p>
    </footer>
  </div>
</div>

<script src="data.js"></script>
<script>
  (function () {
    const ledger = document.getElementById("ledger");
    const filterBar = document.getElementById("filterBar");
    const sorted = ROBOTS.slice().sort((a, b) => a.year - b.year || a.id - b.id);

    function kindOf(r) {
      if (r.fiction) return "fiction";
      if (r.category === "competition") return "competition";
      return "real";
    }
    const KIND_LABEL = { real: "実在", competition: "大会", fiction: "フィクション" };

    sorted.forEach((r) => {
      const kind = kindOf(r);
      const a = document.createElement("a");
      a.className = "ledger-row";
      a.dataset.kind = kind;
      a.href = "index.html?year=" + r.year + "&id=" + r.id;
      a.innerHTML =
        '<span class="ledger-year">' + r.year + "</span>" +
        '<span class="ledger-name">' + r.name + (r.nameEn ? '<span class="ledger-en">' + r.nameEn + "</span>" : "") + "</span>" +
        '<span class="ledger-cat">' + (CATEGORY_LABEL[r.category] || r.category) + "</span>" +
        '<span class="ledger-kind is-' + kind + '">' + KIND_LABEL[kind] + "</span>";
      ledger.appendChild(a);
    });

    const rows = Array.from(ledger.querySelectorAll(".ledger-row"));

    function applyFilter(filter) {
      let lastVisible = null;
      rows.forEach((row) => {
        row.hidden = filter !== "all" && row.dataset.kind !== filter;
        row.classList.remove("is-last-visible");
        if (!row.hidden) lastVisible = row;
      });
      if (lastVisible) lastVisible.classList.add("is-last-visible");
    }

    filterBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-pill");
      if (!btn) return;
      filterBar.querySelectorAll(".filter-pill").forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      applyFilter(btn.dataset.filter);
    });
  })();
</script>
